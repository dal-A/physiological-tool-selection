[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "physiological-tool-selection"
version = "0.7.0"
description = "Frozen PM_P6_20261010_v1 physiological signal adapters and scientific algorithms"
requires-python = ">=3.12"
dependencies = ["numpy==2.5.3", "pandas==3.0.6", "scipy==1.18.1", "scikit-learn==1.9.1", "torch==2.14.0", "wfdb==4.3.1", "joblib==1.6.0"]

[tool.setuptools.packages.find]
include = ["pmtools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"
